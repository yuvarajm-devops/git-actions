name: Deploy Frontend to Ubuntu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          NITRO_PRESET: node-server
        run: bun run build

      - name: Deploy application
        run: |
          set -e

          rm -rf ~/nodewatch
          mkdir -p ~/nodewatch

          cp -r .output ~/nodewatch/
          cp package.json ~/nodewatch/

          cd ~/nodewatch

          pkill -f ".output/server/index.mjs" || true

          nohup env PORT=8080 HOST=0.0.0.0 bun .output/server/index.mjs > app.log 2>&1 &

          sleep 5

          ss -tulnp | grep 8080
